[project]
name = "voice-relay"
version = "0.0.1"
description = "iOS full-duplex voice relay: ChatGPT Live + Beatrice 2 voice conversion"
requires-python = ">=3.12"
dependencies = [
    "aiortc>=1.9",
    "aiohttp>=3.10",
    "sounddevice>=0.5",
    "numpy>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
relay = "relay.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/relay"]

# 注意: このプロジェクトは Windows 側 Python で動かす（WSL ではない）。
# WASAPI デバイス (VB-Cable) と VST3 ホストのサブプロセスに触るため。
# セットアップ: uv venv --python 3.12 && uv pip install -e .
